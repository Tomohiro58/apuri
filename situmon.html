<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>推し選手診断 | 分析フォーム</title>

    <!-- 共通CSSファイルを読み込み -->
    <link rel="stylesheet" href="style.css" />

    <style>
      /* 質問ページ固有の追加・調整スタイル */
      .page-header {
        text-align: center;
        padding: 24px 0 32px;
      }
      .page-header h1 {
        font-size: clamp(24px, 4vw, 36px);
        letter-spacing: .05em;
        margin-top: 8px;
      }

      /* 質問カードパネル */
      .question-box {
        background: var(--panel);
        border: 1px solid var(--line);
        clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
        padding: 24px;
        margin-bottom: 24px;
      }

      /* 質問タイトル（アクセントライン付き） */
      .question-title {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        font-size: 16px;
        font-weight: 800;
        margin: 24px 0 14px;
      }
      .question-title:first-child {
        margin-top: 0;
      }
      .question-title::before {
        content: "";
        display: block;
        width: 4px;
        height: 16px;
        background: var(--lime);
      }

      /* 選択肢（ラジオボタンカード） */
      .option {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--panel-light);
        border: 1px solid var(--line);
        padding: 14px 16px;
        margin: 10px 0;
        cursor: pointer;
        font-size: 14px;
        color: #c2d2dd;
        transition: all 0.2s ease;
      }
      .option:hover {
        border-color: var(--cyan);
        background: rgba(69, 228, 232, 0.08);
        color: var(--text);
      }

      /* ラジオボタン自体のカスタムスタイル */
      input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border: 2px solid var(--muted);
        border-radius: 50%;
        outline: none;
        cursor: pointer;
        position: relative;
        flex-shrink: 0;
        transition: all 0.2s ease;
      }
      input[type="radio"]:checked {
        border-color: var(--lime);
        background: var(--lime);
        box-shadow: 0 0 10px rgba(183, 255, 74, 0.5);
      }
      
      /* 選択された状態の親ラベル */
      .option:has(input[type="radio"]:checked) {
        border-color: var(--lime);
        background: rgba(183, 255, 74, 0.06);
        color: var(--lime);
        font-weight: 700;
      }

      /* アクションボタン（共通ボタンの拡張） */
      .btn-submit {
        display: block;
        width: 100%;
        max-width: 320px;
        margin: 28px auto 0;
        min-height: 50px;
        background: var(--lime);
        color: #07111f;
        border: 1px solid var(--lime);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: .08em;
        cursor: pointer;
        transition: transform .2s, background .2s;
      }
      .btn-submit:hover {
        background: #d0ff86;
        transform: translateY(-2px);
      }
      .btn-submit:active {
        transform: translateY(0);
      }

      /* 結果ボタン領域 */
      #resultButton {
        display: none;
        text-align: center;
        margin-top: 32px;
      }
      .btn-result {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 360px;
        min-height: 54px;
        background: linear-gradient(135deg, var(--lime), var(--cyan));
        color: #07111f;
        text-decoration: none;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: .1em;
        border: none;
        box-shadow: 0 0 20px rgba(183, 255, 74, 0.3);
        transition: all 0.2s ease;
      }
      .btn-result:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 28px rgba(69, 228, 232, 0.5);
      }
    </style>
  </head>

  <body>
    <div class="page">
      
      <!-- ヘッダー -->
      <div class="page-header">
        <div class="eyebrow" style="justify-content: center;">DIAGNOSTIC PROCESS</div>
        <h1>⚽ 推し選手分析診断</h1>
      </div>

      <div id="diagnosisForm">

        <!-- 前半質問グループ Q1〜Q4 -->
        <div class="question-box">

          <!-- Q1 -->
          <div class="question-title">Q1. 好きな選手のプレースタイルは？</div>

          <label class="option">
            <input type="radio" name="q1" value="pass">
            <span>正確なパスでチームを動かす</span>
          </label>

          <label class="option">
            <input type="radio" name="q1" value="dribble">
            <span>自分でドリブルして突破する</span>
          </label>

          <label class="option">
            <input type="radio" name="q1" value="shoot">
            <span>シュートでゴールを狙う</span>
          </label>

          <label class="option">
            <input type="radio" name="q1" value="defense">
            <span>守備で相手を止める</span>
          </label>


          <!-- Q2 -->
          <div class="question-title">Q2. チームを支える選手といえば？</div>

          <label class="option">
            <input type="radio" name="q2" value="buildUp">
            <span>パスで攻撃を組み立てる選手</span>
          </label>

          <label class="option">
            <input type="radio" name="q2" value="scorer">
            <span>ゴールを決める選手</span>
          </label>

          <label class="option">
            <input type="radio" name="q2" value="speed">
            <span>スピードで突破する選手</span>
          </label>

          <label class="option">
            <input type="radio" name="q2" value="stopper">
            <span>守備でピンチを防ぐ選手</span>
          </label>


          <!-- Q3 -->
          <div class="question-title">Q3. ゴールにつながるプレーで好きなのは？</div>

          <label class="option">
            <input type="radio" name="q3" value="cross">
            <span>クロスからのゴール</span>
          </label>

          <label class="option">
            <input type="radio" name="q3" value="middle">
            <span>ミドルシュート</span>
          </label>

          <label class="option">
            <input type="radio" name="q3" value="dribbleGoal">
            <span>ドリブルからのゴール</span>
          </label>

          <label class="option">
            <input type="radio" name="q3" value="passWork">
            <span>パスワークからのゴール</span>
          </label>


          <!-- Q4 -->
          <div class="question-title">Q4. チームの強さを感じるのは？</div>

          <label class="option">
            <input type="radio" name="q4" value="possession">
            <span>ボールを長く保持できる</span>
          </label>

          <label class="option">
            <input type="radio" name="q4" value="highScore">
            <span>得点をたくさん決める</span>
          </label>

          <label class="option">
            <input type="radio" name="q4" value="solidDefense">
            <span>守備が安定している</span>
          </label>

          <label class="option">
            <input type="radio" name="q4" value="stamina">
            <span>運動量が多い</span>
          </label>


          <button type="button" class="btn-submit" onclick="showBranch()">
            分析を進める（次へ）
          </button>

        </div>


        <!-- 動的分岐質問挿入エリア -->
        <div id="branchQuestion"></div>


        <!-- 結果ボタン -->
        <div id="resultButton">
         <a href="result.html" class="btn-result"
         onclick="return finishDiagnosis(event)">
         分析結果を表示する ➔
         </a>
        </div>

      </div>
    </div>


    <script>
     
// FOOTBALL DNA 診断処理

// Q1～Q4の回答後、Q1に応じてQ5・Q6を表示
function showBranch() {
  const answers = {};

  // Q1～Q4の回答を確認
  for (let i = 1; i <= 4; i++) {
    const selected = document.querySelector(
      `input[name="q${i}"]:checked`
    );

    if (!selected) {
      alert(`Q${i}を選択してください`);
      return;
    }

    answers[`q${i}`] = selected.value;
  }

  const q1 = answers.q1;
  let html = "";

  // パス型
  if (q1 === "pass") {
    html = `
      <div class="question-box">
        <div class="question-title">Q5. 試合を見るとき気になるのは？</div>
        <label class="option">
          <input type="radio" name="q5" value="control">
          <span>どちらが試合を支配しているか</span>
        </label>
        <label class="option">
          <input type="radio" name="q5" value="chance">
          <span>パスでチャンスを作ること</span>
        </label>

        <div class="question-title">Q6. 推し選手として応援したいのは？</div>
        <label class="option">
          <input type="radio" name="q6" value="playmaker">
          <span>試合を組み立てる選手</span>
        </label>
        <label class="option">
          <input type="radio" name="q6" value="assister">
          <span>アシストする選手</span>
        </label>
      </div>
    `;
  }

  // ドリブル型
  else if (q1 === "dribble") {
    html = `
      <div class="question-box">
        <div class="question-title">Q5. 好きなプレーは？</div>
        <label class="option">
          <input type="radio" name="q5" value="skill">
          <span>ドリブルで抜く</span>
        </label>
        <label class="option">
          <input type="radio" name="q5" value="sprint">
          <span>スピードで先に追いつく</span>
        </label>

        <div class="question-title">Q6. チームのヒーローだと思うのは？</div>
        <label class="option">
          <input type="radio" name="q6" value="gameChanger">
          <span>ドリブルで流れを変えた選手</span>
        </label>
        <label class="option">
          <input type="radio" name="q6" value="heroScorer">
          <span>ゴールを決めた選手</span>
        </label>
      </div>
    `;
  }

  // シュート型
  else if (q1 === "shoot") {
    html = `
      <div class="question-box">
        <div class="question-title">Q5. PKで一番かっこいいと思うのは？</div>
        <label class="option">
          <input type="radio" name="q5" value="power">
          <span>強烈なシュートを決める</span>
        </label>
        <label class="option">
          <input type="radio" name="q5" value="placement">
          <span>冷静にコースへ決める</span>
        </label>

        <div class="question-title">Q6. 推し選手に期待する活躍は？</div>
        <label class="option">
          <input type="radio" name="q6" value="decisive">
          <span>最後まで決定的な仕事をする</span>
        </label>
        <label class="option">
          <input type="radio" name="q6" value="clutch">
          <span>チームが苦しい時に活躍する</span>
        </label>
      </div>
    `;
  }

  // 守備型
  else if (q1 === "defense") {
    html = `
      <div class="question-box">
        <div class="question-title">Q5. 守備の選手に魅力を感じるのは？</div>
        <label class="option">
          <input type="radio" name="q5" value="save">
          <span>決定的なシュートを止める</span>
        </label>
        <label class="option">
          <input type="radio" name="q5" value="tackle">
          <span>相手からボールを奪う</span>
        </label>

        <div class="question-title">Q6. 推し選手として応援したいのは？</div>
        <label class="option">
          <input type="radio" name="q6" value="guardian">
          <span>チームを守る選手</span>
        </label>
        <label class="option">
          <input type="radio" name="q6" value="lastWall">
          <span>最後の砦となる選手</span>
        </label>
      </div>
    `;
  }

  const branchContainer = document.getElementById("branchQuestion");
  branchContainer.innerHTML = html;

  // Q5・Q6の回答が終わるまで結果ボタンは表示しない
  document.getElementById("resultButton").style.display = "none";

  // Q5・Q6の回答を確認
  branchContainer.querySelectorAll('input[name="q5"], input[name="q6"]')
    .forEach(input => {
      input.addEventListener("change", checkBranchAnswers);
    });

  branchContainer.scrollIntoView({ behavior: "smooth" });
}


// Q5・Q6の両方に回答したか確認
function checkBranchAnswers() {
  const q5 = document.querySelector('input[name="q5"]:checked');
  const q6 = document.querySelector('input[name="q6"]:checked');

  document.getElementById("resultButton").style.display =
    q5 && q6 ? "block" : "none";
}


// タイプ別の点数を計算
function calculateResult() {
  const answers = {};

  for (let i = 1; i <= 6; i++) {
    const selected = document.querySelector(
      `input[name="q${i}"]:checked`
    );

    if (!selected) {
      alert(`Q${i}を選択してください`);
      return null;
    }

    answers[`q${i}`] = selected.value;
  }

  const scores = {
    dribbler: 0,
    striker: 0,
    passer: 0,
    defender: 0,
    goalkeeper: 0
  };

  // 回答ごとの加点ルール
  const scoring = {
    q1: {
      pass: "passer",
      dribble: "dribbler",
      shoot: "striker",
      defense: "defender"
    },
    q2: {
      buildUp: "passer",
      scorer: "striker",
      speed: "dribbler",
      stopper: "defender"
    },
    q3: {
      cross: "passer",
      middle: "striker",
      dribbleGoal: "dribbler",
      passWork: "passer"
    },
    q4: {
      possession: "passer",
      highScore: "striker",
      solidDefense: "defender",
      stamina: "dribbler"
    },
    q5: {
      control: "passer",
      chance: "passer",
      skill: "dribbler",
      sprint: "dribbler",
      power: "striker",
      placement: "striker",
      save: "goalkeeper",
      tackle: "defender"
    },
    q6: {
      playmaker: "passer",
      assister: "passer",
      gameChanger: "dribbler",
      heroScorer: "striker",
      decisive: "striker",
      clutch: "striker",
      guardian: "goalkeeper",
      lastWall: "defender"
    }
  };

  // Q1～Q4は1・2点、Q5・Q6は2点
  const weights = {
    q1: 2,
    q2: 1,
    q3: 1,
    q4: 1,
    q5: 2,
    q6: 2
  };

  // 全回答を点数化
  for (let i = 1; i <= 6; i++) {
    const question = `q${i}`;
    const answer = answers[question];
    const type = scoring[question][answer];

    if (type) {
      scores[type] += weights[question];
    }
  }

  // 最も点数が高いタイプを取得
  const maxScore = Math.max(...Object.values(scores));
  const candidates = Object.keys(scores).filter(
    type => scores[type] === maxScore
  );

  // 同点の場合はQ1の好みを優先
  const q1Type = scoring.q1[answers.q1];
  const resultType = candidates.includes(q1Type)
    ? q1Type
    : candidates[0];

  return {
    type: resultType,
    scores: scores,
    answers: answers
  };
}


// 結果を保存して結果ページへ移動
function finishDiagnosis(event) {
  event.preventDefault();

  const result = calculateResult();

  if (!result) {
    return false;
  }

  sessionStorage.setItem(
    "footballDiagnosis",
    JSON.stringify(result)
  );

  location.href = "result.html";
  return false;
}


// Q1を変更した場合、以前の分岐回答をリセット
document.querySelectorAll('input[name="q1"]').forEach(input => {
  input.addEventListener("change", () => {
    document.getElementById("branchQuestion").innerHTML = "";
    document.getElementById("resultButton").style.display = "none";
  });
});

    </script>
  </body>
</html>
