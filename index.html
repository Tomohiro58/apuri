<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>推しサカ！ | あなたにぴったりの推し選手診断</title>

    <!-- 共通CSSファイルを読み込み -->
    <link rel="stylesheet" href="style.css" />

    <style>
      /* 画面中央に配置するベーススタイル */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px;
      }

      /* トップページ固有のスタイル */
      .container {
        position: relative;
        width: min(440px, 100%);
        margin: 0 auto; /* 左右中央寄せ */
        background: var(--panel);
        border: 1px solid var(--line);
        clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%);
        padding: 32px 24px 28px;
        text-align: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--lime);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .15em;
        margin-bottom: 16px;
      }
      .eyebrow::before {
        content: "";
        width: 16px;
        height: 2px;
        background: var(--lime);
      }

      .hero-image {
        font-size: 56px;
        margin-bottom: 12px;
        filter: drop-shadow(0 0 16px rgba(69,228,232,.4));
      }

      .badge {
        display: inline-block;
        color: var(--lime);
        border: 1px solid rgba(183,255,74,.45);
        font-size: 10px;
        letter-spacing: .12em;
        padding: 4px 10px;
        margin-bottom: 16px;
        white-space: nowrap;
      }

      .page-title {
        font-size: clamp(22px, 5vw, 28px);
        line-height: 1.25;
        letter-spacing: .03em;
        color: var(--text);
        margin-bottom: 14px;
      }

      p.description {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.8;
        margin-bottom: 24px;
      }

      .features {
        background: rgba(4,14,25,.56);
        border-left: 2px solid var(--lime);
        border-top: 1px solid var(--line);
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 16px 18px;
        margin-bottom: 24px;
        text-align: left;
      }

      .feature-item {
        font-size: 12px;
        color: #c2d2dd;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        line-height: 1.5;
      }
      .feature-item:last-child {
        margin-bottom: 0;
      }
      .feature-item span {
        margin-right: 10px;
        font-size: 14px;
      }

      .btn-start {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 50px;
        background: var(--lime);
        color: #07111f;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: .08em;
        text-decoration: none;
        border: 1px solid var(--lime);
        cursor: pointer;
        transition: transform .2s, background .2s;
      }
      .btn-start:hover {
        background: #d0ff86;
        transform: translateY(-2px);
      }
      .btn-start:active {
        transform: translateY(0);
      }

      .time-note {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: .1em;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="eyebrow">FOOTBALL ANALYTICS</div>
      <div class="hero-image">⚽️</div>
      <div class="badge">データスタジアム連携企画</div>

      <h1 class="page-title">推しサカ！<br />〜推し選手タイプ診断〜</h1>

      <p class="description">
        ルールがわからなくても大丈夫！<br />
        直感で答えるだけで、データ分析から<br />あなたにぴったりの「選手タイプ」を弾き出します。
      </p>

      <div class="features">
        <div class="feature-item">
          <span>⏱️</span> 所要時間はたったの1分（全6問）
        </div>
        <div class="feature-item">
          <span>📊</span> プレーデータを独自の指標でビジュアル化
        </div>
        <div class="feature-item">
          <span>🌟</span> 運命の選手との出会いが観戦をもっと楽しく！
        </div>
      </div>

      <a href="situmon.html" class="btn-start">診断をはじめる ➔</a>

      <div class="time-note">※登録不要・完全無料</div>
    </div>
  </body>
</html>
