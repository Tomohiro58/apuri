<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>診断結果</title>

    <style>
      /* =========================
       基本設定
    ========================= */

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Noto Sans JP",
          "Hiragino Kaku Gothic ProN", sans-serif;

        background: #f5f3ff;
        color: #333;
        min-height: 100vh;
      }

      button {
        font-family: inherit;
      }

      /* =========================
       ページ全体
    ========================= */

      .page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }

      .result-container {
        width: 100%;
        max-width: 560px;
      }

      /* =========================
       ヘッダー
    ========================= */

      .header {
        text-align: center;
        margin-bottom: 24px;
      }

      .header-label {
        display: inline-block;
        color: #7357e8;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
      }

      .header h1 {
        font-size: 28px;
        font-weight: 800;
        color: #222;
      }

      /* =========================
       結果カード
    ========================= */

      .result-card {
        background: #fff;
        border-radius: 28px;
        padding: 32px 24px;
        box-shadow: 0 12px 40px rgba(80, 60, 150, 0.12);
        text-align: center;
        overflow: hidden;
      }

      /* =========================
       結果画像
    ========================= */

      .result-image {
        width: 160px;
        height: 160px;
        margin: 0 auto 24px;

        border-radius: 50%;

        background: linear-gradient(135deg, #a78bfa, #7c5cff);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 72px;

        box-shadow: 0 12px 30px rgba(124, 92, 255, 0.25);
      }

      /* =========================
       結果テキスト
    ========================= */

      .result-label {
        font-size: 13px;
        color: #888;
        font-weight: 700;
        letter-spacing: 0.1em;
        margin-bottom: 8px;
      }

      .result-type {
        font-size: 36px;
        font-weight: 900;
        color: #6d4ce6;
        line-height: 1.3;
        margin-bottom: 8px;
      }

      .result-catch {
        font-size: 15px;
        font-weight: 700;
        color: #555;
        margin-bottom: 24px;
      }

      /* =========================
       説明
    ========================= */

      .description {
        background: #f8f7ff;
        border-radius: 18px;
        padding: 20px;
        text-align: left;
        margin-bottom: 28px;
      }

      .description-title {
        font-size: 14px;
        font-weight: 800;
        color: #6d4ce6;
        margin-bottom: 8px;
      }

      .description-text {
        font-size: 14px;
        line-height: 1.9;
        color: #555;
      }

      /* =========================
       スコア
    ========================= */

      .score-section {
        text-align: left;
        margin-bottom: 28px;
      }

      .score-title {
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 18px;
      }

      .score-item {
        margin-bottom: 16px;
      }

      .score-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 700;
      }

      .score-value {
        color: #7357e8;
      }

      .score-bar {
        width: 100%;
        height: 9px;
        background: #ece9f8;
        border-radius: 999px;
        overflow: hidden;
      }

      .score-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;

        background: linear-gradient(90deg, #a78bfa, #7357e8);

        transition: width 1s ease;
      }

      /* =========================
    ボタン
    ========================= */

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .button {
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 15px 20px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .button-primary {
        color: #fff;
        background: linear-gradient(135deg, #8b6cff, #6948e8);

        box-shadow: 0 8px 20px rgba(105, 72, 232, 0.25);
      }

      .button-secondary {
        color: #6d4ce6;
        background: #f1efff;
      }

      /* =========================
    フッター
    ========================= */

      .footer {
        text-align: center;
        color: #999;
        font-size: 11px;
        margin-top: 20px;
      }

      /* =========================
    スマホ
    ========================= */

      @media (max-width: 480px) {
        .page {
          padding: 24px 12px;
        }

        .result-card {
          padding: 28px 18px;
          border-radius: 24px;
        }

        .header h1 {
          font-size: 24px;
        }

        .result-image {
          width: 130px;
          height: 130px;
          font-size: 58px;
        }

        .result-type {
          font-size: 30px;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="result-container">
        <!-- =====================
        ページタイトル
    ====================== -->

        <header class="header">
          <div class="header-label">DIAGNOSIS RESULT</div>

          <h1>診断結果</h1>
        </header>

        <!-- =====================
        結果カード
    ====================== -->

        <section class="result-card">
          <!-- 結果イメージ -->
          <div class="result-image">😎</div>

          <!-- 結果 -->
          <div class="result-label">あなたのタイプは</div>

          <div class="result-type">はっちゃけタイプ</div>

          <div class="result-catch">周りを明るくする、ポジティブな人</div>

          <!-- 説明 -->
          <div class="description">
            <div class="description-title">あなたの特徴</div>

            <p class="description-text">
              あなたは明るく前向きな性格の持ち主。
              自分だけでなく、周りの人まで自然と 笑顔にできる魅力があります。
              新しいことにも積極的に挑戦できるタイプです。
            </p>
          </div>

          <!-- =====================
            スコア
        ====================== -->

          <div class="score-section">
            <div class="score-title">あなたの傾向</div>

            <div class="score-item">
              <div class="score-header">
                <span>ポジティブ</span>
                <span class="score-value">92%</span>
              </div>

              <div class="score-bar">
                <div class="score-fill" data-score="92"></div>
              </div>
            </div>

            <div class="score-item">
              <div class="score-header">
                <span>行動力</span>
                <span class="score-value">78%</span>
              </div>

              <div class="score-bar">
                <div class="score-fill" data-score="78"></div>
              </div>
            </div>

            <div class="score-item">
              <div class="score-header">
                <span>協調性</span>
                <span class="score-value">85%</span>
              </div>

              <div class="score-bar">
                <div class="score-fill" data-score="85"></div>
              </div>
            </div>

            <div class="score-item">
              <div class="score-header">
                <span>慎重さ</span>
                <span class="score-value">54%</span>
              </div>

              <div class="score-bar">
                <div class="score-fill" data-score="54"></div>
              </div>
            </div>
          </div>

          <!-- =====================
            ボタン
        ====================== -->

          <div class="buttons">
            <button class="button button-primary" onclick="shareResult()">
              結果をシェアする
            </button>

            <button
              class="button button-secondary"
              onclick="restartDiagnosis()"
            >
              もう一度診断する
            </button>
          </div>
        </section>

        <footer class="footer">© 2026 Diagnosis App</footer>
      </div>
    </main>

    <script>
      /* =========================
    スコアバーのアニメーション
    ========================= */

      window.addEventListener("load", () => {
        const bars = document.querySelectorAll(".score-fill");

        bars.forEach((bar) => {
          const score = bar.dataset.score;

          setTimeout(() => {
            bar.style.width = score + "%";
          }, 200);
        });
      });

      /* =========================
    シェア
    ========================= */

      function shareResult() {
        const text = "診断結果は「キラキラタイプ」でした！✨";

        if (navigator.share) {
          navigator.share({
            title: "診断結果",
            text: text,
          });
        } else {
          navigator.clipboard.writeText(text);

          alert("診断結果をコピーしました！");
        }
      }

      /* =========================
    もう一度診断
    ========================= */

      function restartDiagnosis() {
        // 今はサンプルとしてページをリロード
        location.reload();

        // 後でここを
        // location.href = "question.html";
        // のように変更できます。
      }
    </script>
  </body>
</html>
